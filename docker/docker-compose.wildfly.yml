version: '3.8'

# =============================================================================
# FINANCE APP - Local WildFly Development
# =============================================================================
# Deploy:   docker-compose -f docker-compose.wildfly.yml up -d --build
# Stop:     docker-compose -f docker-compose.wildfly.yml down
# Logs:     docker logs -f finance-wildfly
# =============================================================================

services:
  finance-wildfly:
    build:
      context: .
      dockerfile: Dockerfile.wildfly
    container_name: finance-wildfly
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8080"      # Application port
      - "127.0.0.1:9991:9990"      # Management console
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_PASSWORD=6qZB6d@pIvj
      - JAVA_OPTS=-Xms256m -Xmx512m
    volumes:
      - ../Backend/target/temco-finance.war:/opt/jboss/wildfly/standalone/deployments/temco-finance.war
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/temco-finance/api/partners/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - finance-network

networks:
  finance-network:
    driver: bridge
