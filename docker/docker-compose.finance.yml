version: '3.8'

# =============================================================================
# FINANCE APP - Production Deployment
# =============================================================================
# Deploy:   docker-compose -f docker-compose.finance.yml up -d --build
# Stop:     docker-compose -f docker-compose.finance.yml down
# Rebuild:  docker-compose -f docker-compose.finance.yml up -d --build --force-recreate
# Logs:     docker logs -f finance-api
#           docker logs -f finance-frontend
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # FINANCE FRONTEND (Nginx) - Serves Finance UI
  # Accessible via: finance.temcobank.com → Host Nginx → localhost:8091
  # ---------------------------------------------------------------------------
  finance-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: finance-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:80"   # Only localhost, Host Nginx will proxy
    depends_on:
      - finance-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - finance-network

  # ---------------------------------------------------------------------------
  # FINANCE API (Node.js) - REST API Server
  # Internal only - accessed by finance-frontend via Docker network
  # ---------------------------------------------------------------------------
  finance-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: finance-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8086"   # HTTP (localhost only for debugging)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Allow container to reach host services
    environment:
      - NODE_ENV=production
      - DB_HOST=host.docker.internal          # Connect to HOST MariaDB
      - DB_PORT=3306
      - DB_NAME=temco_system
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-temco123}
      - PORT=8086
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8086/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - finance-network

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  # Isolated network for finance containers only
  finance-network:
    driver: bridge
