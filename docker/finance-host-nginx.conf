# =============================================================================
# HOST NGINX CONFIGURATION - finance.temcobank.com
# =============================================================================
# For Cloudflare Flexible SSL Mode (HTTP only on origin)
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name finance.temcobank.com;

    access_log /var/log/nginx/finance.temcobank.com.access.log;
    error_log /var/log/nginx/finance.temcobank.com.error.log;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /nginx-health {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
