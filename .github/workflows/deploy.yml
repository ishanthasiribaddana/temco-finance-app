# =============================================================================
# TEMCO Finance App - CI/CD Pipeline
# =============================================================================
# Triggers: Push to master branch or manual dispatch
# Deploys to: 109.123.227.166 (production server)
# =============================================================================

name: Deploy Finance App

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ===========================================================================
  # JOB 1: Build and Test
  # ===========================================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            api-server/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install API dependencies
        working-directory: ./api-server
        run: npm ci --only=production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 1

  # ===========================================================================
  # JOB 2: Deploy to Production
  # ===========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment: finance-production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Production Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          APP_DIR: /opt/temco/finance-app
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "🚀 Starting deployment to production..."
          
          # Create deployment script
          cat << 'DEPLOY_SCRIPT' > deploy_remote.sh
          #!/bin/bash
          set -e
          
          APP_DIR="/opt/temco/finance-app"
          
          echo "📦 Pulling latest code..."
          cd $APP_DIR
          git fetch origin
          git reset --hard origin/master
          
          echo "🐳 Rebuilding Docker containers..."
          cd $APP_DIR/docker
          docker-compose -f docker-compose.finance.yml down || true
          docker-compose -f docker-compose.finance.yml up -d --build --force-recreate
          
          echo "⏳ Waiting for containers to be healthy..."
          sleep 10
          
          echo "✅ Checking container status..."
          docker ps --filter "name=finance" --format "table {{.Names}}\t{{.Status}}"
          
          echo "🏥 Running health checks..."
          curl -sf http://127.0.0.1:8086/api/health || echo "⚠️ API health check failed"
          curl -sf http://127.0.0.1:8091/health || echo "⚠️ Frontend health check failed"
          
          echo "🎉 Deployment complete!"
          DEPLOY_SCRIPT
          
          # Copy and execute deployment script
          scp deploy_remote.sh $SERVER_USER@$SERVER_HOST:/tmp/deploy_finance.sh
          ssh $SERVER_USER@$SERVER_HOST "chmod +x /tmp/deploy_finance.sh && sudo /tmp/deploy_finance.sh"

      - name: Verify Deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "🔍 Verifying deployment..."
          ssh $SERVER_USER@$SERVER_HOST "docker ps --filter 'name=finance' --format '{{.Names}}: {{.Status}}'"

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Finance App deployed successfully!"
          echo "🌐 URL: https://finance.temcobank.com"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check logs above for details."
          exit 1

  # ===========================================================================
  # JOB 3: Post-deployment Verification
  # ===========================================================================
  verify:
    name: Post-deployment Verification
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Health Check - API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://finance.temcobank.com/api/health || echo "000")
          if [ "$response" = "200" ]; then
            echo "✅ API health check passed"
          else
            echo "⚠️ API health check returned: $response"
          fi

      - name: Health Check - Frontend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://finance.temcobank.com/ || echo "000")
          if [ "$response" = "200" ]; then
            echo "✅ Frontend health check passed"
          else
            echo "⚠️ Frontend health check returned: $response"
          fi

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "  DEPLOYMENT SUMMARY"
          echo "=========================================="
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "URL: https://finance.temcobank.com"
          echo "=========================================="
