# =============================================================================
# TEMCO Finance App - CI/CD Pipeline (Java EE + React)
# =============================================================================
# Triggers: Push to master branch or manual dispatch
# Deploys to: 109.123.227.166 (production server)
# Backend: WildFly 26.1.3 (Java EE)
# Frontend: React + Vite + Nginx
# =============================================================================

name: Deploy Finance App

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ===========================================================================
  # JOB 1: Build Java EE Backend (WildFly WAR)
  # ===========================================================================
  build-backend:
    name: Build Java EE Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build WAR with Maven
        working-directory: ./temco-api
        run: mvn clean package -DskipTests -B

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: temco-api-war
          path: temco-api/target/temco-api.war
          retention-days: 1

  # ===========================================================================
  # JOB 2: Build Frontend (React + Vite)
  # ===========================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 1

  # ===========================================================================
  # JOB 3: Deploy to Production
  # ===========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: finance-production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: temco-api-war
          path: ./artifacts

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend-dist

      - name: Setup SSH Key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy WAR to WildFly
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "🚀 Deploying Java EE WAR to WildFly..."
          
          # Copy WAR file to server
          scp ./artifacts/temco-api.war $SERVER_USER@$SERVER_HOST:/tmp/temco-api.war
          
          # Deploy to WildFly
          ssh $SERVER_USER@$SERVER_HOST << 'EOF'
            echo "📦 Deploying WAR to WildFly..."
            WILDFLY_DIR="/opt/wildfly"
            DEPLOY_DIR="$WILDFLY_DIR/standalone/deployments"
            
            # Stop existing deployment
            sudo rm -f $DEPLOY_DIR/temco-api.war.deployed 2>/dev/null || true
            sudo rm -f $DEPLOY_DIR/temco-api.war 2>/dev/null || true
            
            # Deploy new WAR
            sudo cp /tmp/temco-api.war $DEPLOY_DIR/
            sudo chown wildfly:wildfly $DEPLOY_DIR/temco-api.war
            
            # Wait for deployment
            echo "⏳ Waiting for WildFly deployment..."
            for i in {1..30}; do
              if [ -f "$DEPLOY_DIR/temco-api.war.deployed" ]; then
                echo "✅ WAR deployed successfully!"
                break
              elif [ -f "$DEPLOY_DIR/temco-api.war.failed" ]; then
                echo "❌ WAR deployment failed!"
                cat $DEPLOY_DIR/temco-api.war.failed
                exit 1
              fi
              sleep 2
            done
            
            # Health check
            echo "🏥 Running API health check..."
            curl -sf http://127.0.0.1:8080/temco-api/api/health || echo "⚠️ API health check pending..."
          EOF

      - name: Deploy Frontend
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "🚀 Deploying Frontend..."
          
          # Package frontend dist
          tar -czf frontend-dist.tar.gz -C ./frontend-dist .
          
          # Copy to server
          scp frontend-dist.tar.gz $SERVER_USER@$SERVER_HOST:/tmp/frontend-dist.tar.gz
          
          # Deploy frontend
          ssh $SERVER_USER@$SERVER_HOST << 'EOF'
            FRONTEND_DIR="/var/www/finance"
            
            echo "📦 Extracting frontend build..."
            sudo mkdir -p $FRONTEND_DIR
            sudo rm -rf $FRONTEND_DIR/*
            sudo tar -xzf /tmp/frontend-dist.tar.gz -C $FRONTEND_DIR
            sudo chown -R www-data:www-data $FRONTEND_DIR
            
            echo "🔄 Reloading Nginx..."
            sudo nginx -t && sudo systemctl reload nginx
            
            echo "✅ Frontend deployed!"
          EOF

      - name: Verify Deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "🔍 Verifying deployment..."
          ssh $SERVER_USER@$SERVER_HOST << 'EOF'
            echo "=== WildFly Deployments ==="
            ls -la /opt/wildfly/standalone/deployments/*.war* 2>/dev/null || echo "No WAR files found"
            
            echo ""
            echo "=== Service Status ==="
            sudo systemctl status wildfly --no-pager -l | head -20 || true
            sudo systemctl status nginx --no-pager -l | head -10 || true
            
            echo ""
            echo "=== Health Checks ==="
            curl -sf http://127.0.0.1:8080/temco-api/api/health && echo " - API OK" || echo " - API PENDING"
          EOF

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Finance App deployed successfully!"
          echo "🌐 URL: https://finance.temcobank.com"
          echo "📦 Backend: WildFly (Java EE)"
          echo "🎨 Frontend: React + Nginx"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check logs above for details."
          exit 1

  # ===========================================================================
  # JOB 4: Post-deployment Verification
  # ===========================================================================
  verify:
    name: Post-deployment Verification
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Health Check - Java EE API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://finance.temcobank.com/api/health || echo "000")
          if [ "$response" = "200" ]; then
            echo "✅ Java EE API health check passed"
          else
            echo "⚠️ API health check returned: $response"
          fi

      - name: Health Check - Frontend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://finance.temcobank.com/ || echo "000")
          if [ "$response" = "200" ]; then
            echo "✅ Frontend health check passed"
          else
            echo "⚠️ Frontend health check returned: $response"
          fi

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "  DEPLOYMENT SUMMARY (v3.0.0)"
          echo "=========================================="
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Backend: WildFly 26.1.3 (Java EE)"
          echo "Frontend: React + Vite + Nginx"
          echo "URL: https://finance.temcobank.com"
          echo "=========================================="
