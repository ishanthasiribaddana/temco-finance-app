# =============================================================================
# TEMCO Finance App - CI/CD Pipeline (Docker-based Deployment)
# =============================================================================
# Triggers: Push to master branch or manual dispatch
# Deploys to: 109.123.227.166 (production server)
# Backend: WildFly 26.1.3 (Java EE) in Docker
# Frontend: React + Vite + Nginx in Docker
# =============================================================================

name: Deploy Finance App

on:
  push:
    branches:
      - master
    paths:
      - 'temco-api/**'
      - 'frontend/**'
      - 'docker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ===========================================================================
  # JOB 1: Build Java EE Backend (WildFly WAR)
  # ===========================================================================
  build-backend:
    name: Build Java EE Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Build WAR with Maven
        working-directory: ./temco-api
        run: mvn clean package -DskipTests -B

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: temco-api-war
          path: temco-api/target/temco-api.war
          retention-days: 1

  # ===========================================================================
  # JOB 2: Build Frontend (React + Vite)
  # ===========================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 1

  # ===========================================================================
  # JOB 3: Deploy to Production (Docker)
  # ===========================================================================
  deploy:
    name: Deploy to Production (Docker)
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    environment: finance-production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: temco-api-war
          path: ./temco-api/target

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/dist

      - name: Setup SSH Key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Sync code to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "� Syncing code to production server..."
          
          # Create deployment package
          tar -czf deploy-package.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='*.log' \
            temco-api/target/temco-api.war \
            frontend/dist \
            docker/
          
          # Copy to server
          scp deploy-package.tar.gz $SERVER_USER@$SERVER_HOST:/tmp/deploy-package.tar.gz
          
          echo "✅ Code synced to server"

      - name: Deploy Docker Containers
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "🐳 Deploying Docker containers..."
          
          ssh $SERVER_USER@$SERVER_HOST << 'EOF'
            set -e
            APP_DIR="/opt/temco/finance-app"
            
            echo "📦 Extracting deployment package..."
            cd $APP_DIR
            tar -xzf /tmp/deploy-package.tar.gz --strip-components=0
            
            echo "🛑 Stopping existing containers..."
            docker-compose -f docker/docker-compose.yml down --remove-orphans 2>/dev/null || true
            
            echo "� Building Docker images..."
            docker-compose -f docker/docker-compose.yml build --no-cache
            
            echo "🚀 Starting containers..."
            docker-compose -f docker/docker-compose.yml up -d
            
            echo "⏳ Waiting for containers to be healthy..."
            sleep 30
            
            echo "📊 Container status:"
            docker-compose -f docker/docker-compose.yml ps
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            
            echo "✅ Docker deployment complete!"
          EOF

      - name: Verify Deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "🔍 Verifying deployment..."
          ssh $SERVER_USER@$SERVER_HOST << 'EOF'
            echo "=== Docker Containers ==="
            docker ps --filter "name=finance" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            echo ""
            echo "=== Health Checks ==="
            # API health check
            if curl -sf http://127.0.0.1:8087/temco-api/api/health > /dev/null 2>&1; then
              echo "✅ API: Healthy"
            else
              echo "⚠️ API: Starting up..."
            fi
            
            # Frontend health check
            if curl -sf http://127.0.0.1:8091/ > /dev/null 2>&1; then
              echo "✅ Frontend: Healthy"
            else
              echo "⚠️ Frontend: Starting up..."
            fi
          EOF

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Finance App deployed successfully!"
          echo "🌐 URL: https://finance.temcobank.com"
          echo "� Backend: WildFly (Java EE) in Docker"
          echo "🎨 Frontend: React + Nginx in Docker"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check logs above for details."
          exit 1

  # ===========================================================================
  # JOB 4: Post-deployment Verification
  # ===========================================================================
  verify:
    name: Post-deployment Verification
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Health Check - Java EE API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://finance.temcobank.com/api/health || echo "000")
          if [ "$response" = "200" ]; then
            echo "✅ Java EE API health check passed"
          else
            echo "⚠️ API health check returned: $response (may still be starting)"
          fi

      - name: Health Check - Frontend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://finance.temcobank.com/ || echo "000")
          if [ "$response" = "200" ]; then
            echo "✅ Frontend health check passed"
          else
            echo "⚠️ Frontend health check returned: $response"
          fi

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "  DEPLOYMENT SUMMARY (v4.0.0 - Docker)"
          echo "=========================================="
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Backend: WildFly 26.1.3 (Java EE) in Docker"
          echo "Frontend: React + Vite + Nginx in Docker"
          echo "URL: https://finance.temcobank.com"
          echo "=========================================="
