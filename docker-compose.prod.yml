# =============================================================================
# FINANCE APP - Production Overrides
# =============================================================================
# Usage: docker-compose -f docker-compose.base.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # WildFly - Production overrides
  # ---------------------------------------------------------------------------
  wildfly:
    container_name: finance-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "127.0.0.1:8087:8080"   # SSO API port
      - "127.0.0.1:9991:9990"   # Admin console localhost only
    volumes:
      - ./deployments:/opt/jboss/wildfly/standalone/deployments

  # ---------------------------------------------------------------------------
  # Frontend - Production Nginx (static files)
  # Auth via SSOService (:8085), Finance API via WildFly (:8087)
  # ---------------------------------------------------------------------------
  frontend:
    image: nginx:alpine
    container_name: finance-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - VITE_SSO_API_URL=/api
    depends_on:
      - wildfly
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - temco-network

  # ---------------------------------------------------------------------------
  # Redis - Production (no exposed ports)
  # ---------------------------------------------------------------------------
  redis:
    container_name: finance-redis
