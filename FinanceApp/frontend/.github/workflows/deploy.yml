# =============================================================================
# TEMCO Finance App - CI/CD Pipeline
# =============================================================================
# Triggers: Push to master branch or manual dispatch
# Deploys to: 109.123.227.166 (production server)
# =============================================================================

name: Deploy Finance App

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  # ===========================================================================
  # JOB 1: Build and Test
  # ===========================================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install API dependencies
        working-directory: ./api-server
        run: npm install --omit=dev

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 1

  # ===========================================================================
  # JOB 2: Deploy to Production
  # ===========================================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    environment: finance-production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Production Server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          APP_DIR: /opt/temco/finance-app
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          echo "🚀 Starting deployment to production..."
          
          # Create deployment script
          cat << 'DEPLOY_SCRIPT' > deploy_remote.sh
          #!/bin/bash
          set -e
          
          APP_DIR="/opt/temco/finance-app"
          GIT_REPO="https://github.com/ishanthasiribaddana/temco-finance-app.git"
          
          echo "📦 Setting up application directory..."
          if [ ! -d "$APP_DIR" ]; then
            echo "Creating directory and cloning repository..."
            sudo mkdir -p /opt/temco
            cd /opt/temco
            sudo git clone $GIT_REPO finance-app
            sudo chown -R $USER:$USER $APP_DIR
          fi
          
          echo "📦 Pulling latest code..."
          cd $APP_DIR
          git fetch origin
          git reset --hard origin/master
          
          echo "🐳 Rebuilding Docker containers..."
          cd $APP_DIR/docker
          
          # Stop existing containers
          docker stop finance-frontend finance-api 2>/dev/null || true
          docker rm finance-frontend finance-api 2>/dev/null || true
          
          # Build and start with plain docker commands (avoid docker-compose issues)
          cd $APP_DIR
          docker build --no-cache -t docker_finance-frontend:latest -f docker/Dockerfile.frontend .
          docker build -t docker_finance-api:latest -f docker/Dockerfile.api .
          
          # Create network if not exists
          docker network create docker_finance-network 2>/dev/null || true
          
          # Start containers
          docker run -d --name finance-api --network docker_finance-network -p 127.0.0.1:8086:8086 --restart unless-stopped --add-host=host.docker.internal:host-gateway docker_finance-api:latest
          docker run -d --name finance-frontend --network docker_finance-network -p 8091:80 --restart unless-stopped docker_finance-frontend:latest
          
          echo "⏳ Waiting for containers to be healthy..."
          sleep 10
          
          echo "✅ Checking container status..."
          docker ps --filter "name=finance" --format "table {{.Names}}\t{{.Status}}"
          
          echo "🏥 Running health checks..."
          curl -sf http://127.0.0.1:8086/api/health || echo "⚠️ API health check failed"
          curl -sf http://127.0.0.1:8091/ || echo "⚠️ Frontend health check failed"
          
          echo "🎉 Deployment complete!"
          DEPLOY_SCRIPT
          
          # Copy and execute deployment script
          scp -i ~/.ssh/id_ed25519 deploy_remote.sh $SERVER_USER@$SERVER_HOST:/tmp/deploy_finance.sh
          ssh -i ~/.ssh/id_ed25519 $SERVER_USER@$SERVER_HOST "chmod +x /tmp/deploy_finance.sh && sudo /tmp/deploy_finance.sh"

      - name: Verify Deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "🔍 Verifying deployment..."
          ssh -i ~/.ssh/id_ed25519 $SERVER_USER@$SERVER_HOST "docker ps --filter 'name=finance' --format '{{.Names}}: {{.Status}}'"

      - name: Notify Success
        if: success()
        run: |
          echo "✅ Finance App deployed successfully!"
          echo "🌐 URL: https://finance.temcobank.com"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check logs above for details."
          exit 1

  # ===========================================================================
  # JOB 3: Post-deployment Verification
  # ===========================================================================
  verify:
    name: Post-deployment Verification
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Health Check - API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://finance.temcobank.com/api/health || echo "000")
          if [ "$response" = "200" ]; then
            echo "✅ API health check passed"
          else
            echo "⚠️ API health check returned: $response"
          fi

      - name: Health Check - Frontend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://finance.temcobank.com/ || echo "000")
          if [ "$response" = "200" ]; then
            echo "✅ Frontend health check passed"
          else
            echo "⚠️ Frontend health check returned: $response"
          fi

      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "  DEPLOYMENT SUMMARY"
          echo "=========================================="
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "URL: https://finance.temcobank.com"
          echo "=========================================="
